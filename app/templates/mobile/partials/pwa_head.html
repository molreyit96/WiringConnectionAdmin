{% load static %}
  <link rel="manifest" href="{% static 'pwa/site.webmanifest' %}" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="WC Mobile" />
  <link rel="apple-touch-icon" href="{% static 'pwa/apple-touch-icon.png' %}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'pwa/favicon-32.png' %}" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register("{% static 'pwa/sw.js' %}").catch(function (err) {
          console.error('SW registration failed', err);
        });
      });
    }
  </script>
