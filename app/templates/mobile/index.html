{% load static%}
<!DOCTYPE html>
<html lang="es">
<head>

  <!-- SITE TITTLE -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include 'mobile/partials/pwa_head.html' %}
  <title>{% block title %}Wiring Connection Admin{% endblock %}</title>
  
  <!-- Font Awesome: subconjunto local de los 81 iconos que usa la PWA.
       Reemplaza al all.min.css del CDN (89 KB de CSS + 127 KB de fuente)
       por 5 KB de CSS + 6 KB de fuente. Mismos glifos, mismo render. -->
  <link rel="stylesheet" href="{% static 'mobile/css/fa-subset.css' %} ">
  
  <!-- Bootstrap -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
   {% comment %} <link rel="stylesheet" href="{% static 'mobile/css/general.css' %} ">  {% endcomment %}
   <link rel="stylesheet" href="{% static 'css/style.css' %} "> 
   <link rel="stylesheet" href="{% static 'mobile/css/tokens.css' %} "> 

  <style>
    body, html {
      height: 100%;
      margin: 0;
    }
    .content-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .content {
      flex: 1;
      padding-top: 10px; /* Adjust for fixed navbar */
    }
    .navbar-brand img {
      margin-left: 10%;
      border-radius: 5%;
    }
  
    .r-header {
      margin-right: 3%;
      border-radius: 10%;
    }
  
    .card {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border: none;
    }
    .card-title {
      font-weight: bold;
    }
    .footer-nav {
      background-color: #f8f9fa;
      border-top: 1px solid #e7e7e7;
    }
    .footer-nav .btn {
      flex: 1;
      text-align: center;
      width: auto;
    }
    .btn-exit {
      color: red;
    }



  </style>

</head>

<body class="">

  <!-- Page-loading overlay (first painted element; hides on DOM ready, load, or max 3s) -->
  <div id="wcPageLoader" role="status" aria-live="polite">
    <div class="wc-spinner" aria-hidden="true"></div>
    <span>Loading…</span>
  </div>
  <style>
    #wcPageLoader {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--wc-surface);
      transition: opacity .3s ease;
    }
    #wcPageLoader.wc-loader-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .wc-spinner {
      width: 2.75rem;
      height: 2.75rem;
      border: 4px solid var(--wc-border);
      border-top-color: var(--wc-accent);
      border-radius: 50%;
      animation: wc-spin .8s linear infinite;
    }
    #wcPageLoader span {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @keyframes wc-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .wc-spinner { animation: none; }
    }
  </style>

  <div class="content-wrapper">
    <div class="">
      <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top d-flex justify-content-between" id="mainNav">
        <div>
          <a class="navbar-brand" href="/mobile/">
            <img src="{% static 'images/WC_logo.jpg' %}" width="100" height="35" class="d-inline-block align-top" alt="">
          </a>
        </div>

        <div class="r-header">
          <div class="d-flex align-items-center">
            <i class="fa-solid fa-circle-user lead me-2"></i> <span>{{ user.username }} - {{ emp }}</span>
            <button type="button" id="theme-toggle" class="btn btn-outline-secondary btn-sm ms-2 tap-target p-0" style="width: 32px; height: 32px;" aria-label="Toggle theme">
              <i class="fa-solid fa-sun icon-theme-sun"></i>
              <i class="fa-solid fa-moon icon-theme-moon" style="display: none;"></i>
            </button>
          </div>
        </div>
      </nav>
    </div>

    <!-- JQuery (loaded before child content so inline $() works) -->
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>

    {% block container %}
    {% endblock %}
  </div>

  <!-- Dashboard route link -->
  <nav class="navbar navbar-expand-lg navbar-light footer-nav fixed-bottom">
    <div class="container-fluid d-flex">
      <a class="btn btn-link nav-link {% if request.path == '/mobile/' or request.path|slice:":12" == '/mobile/home' %}active{% endif %} tap-target" href="/mobile/">
        <i class="fa fa-home"></i><span class="ms-1">Home</span>
      </a>

      <a class="btn btn-link nav-link {% if request.path|slice:":17" == '/mobile/dashboard' %}active{% endif %} tap-target" href="/mobile/dashboard/" id="wc-dashboard-tab">
        <i class="fa-solid fa-chart-pie"></i><span class="ms-1">Dashboard</span>
      </a>

      <a class="btn btn-link nav-link btn-exit tap-target" href="/logout/">
        <i class="fa fa-sign-out-alt"></i><span class="ms-1">Exit</span>
      </a>
    </div>
  </nav>

  <!-- Theme (dark/light) -->
   <script src="{% static 'mobile/js/theme.js' %}"></script>

  <!-- Fixed chrome height: keep --wc-footer-h equal to the real footer so page
       clearance and sticky action bars track font scaling / longer labels. -->
  <script>
    (function () {
      var footer = document.querySelector('.footer-nav');
      if (!footer) return;
      var apply = function () {
        var h = Math.round(footer.getBoundingClientRect().height);
        if (h > 0) document.documentElement.style.setProperty('--wc-footer-h', h + 'px');
      };
      apply();
      window.addEventListener('load', apply);
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', apply);
      // Self-hosted web font swaps change the footer's metrics.
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(apply).catch(function () {}); }
      if (window.ResizeObserver) { new ResizeObserver(apply).observe(footer); }
    })();
  </script>

   {% block extra_js %}{% endblock %}

   <!-- Page-loading overlay lifecycle + in-app navigation interceptor -->
  <script>
    (function () {
      var el = document.getElementById('wcPageLoader');
      if (!el) return;
      function hide() {
        if (el.dataset.hidden) return;
        el.dataset.hidden = '1';
        el.classList.add('wc-loader-hidden');
      }
      // Reveal the overlay again (e.g. right when the user navigates within the app),
      // so the wait between click and the next page's first paint is covered.
      window.wcShowPageLoader = function () {
        if (!el) return;
        delete el.dataset.hidden;
        el.classList.remove('wc-loader-hidden');
        el.setAttribute('aria-hidden', 'false');
      };
      // Anchor navigations: same-origin paths (/mobile/*, /logout/) with a plain
      // left click. JS-handled links (onclick) and hash-only hrefs are skipped.
      document.addEventListener('click', function (ev) {
        if (ev.defaultPrevented || ev.button !== 0) return;
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
        var a = ev.target && ev.target.closest ? ev.target.closest('a') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (!href || href === '#' || href.charAt(0) !== '/') return;
        if (a.hasAttribute('onclick') || (a.target && a.target !== '_self')) return;
        window.wcShowPageLoader();
      });
      // Standard form POSTs (create/update/upload/approve). AJAX-submitted forms
      // call preventDefault() and are skipped here.
      document.addEventListener('submit', function (ev) {
        if (ev.defaultPrevented) return;
        var f = ev.target;
        if (!f || f.tagName !== 'FORM' || (f.method || '').toLowerCase() !== 'post') return;
        var action = f.getAttribute('action') || '';
        if (action && action.charAt(0) !== '/') return;
        window.wcShowPageLoader();
      });
      document.addEventListener('DOMContentLoaded', hide, { once: true });
      window.addEventListener('load', hide, { once: true });
      setTimeout(hide, 3000);
    })();
  </script>
</body>

</html>
