{% extends 'base_index.html' %}
{% load static %}
{% block content %}

<body class="img js-fullheight" style="background-image: url({% static '/images/wcLogin-bg.jpg'%}); background-repeat: repeat; background-size: cover;">
    <section class="ftco-section">
    <div class="container">
        <div class="row justify-content-center">
                <div class="col-md-6 text-center mb-5">
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4 border pt-4">
                    <div class="login-wrap p-0">
                <h3 class="mb-4 text-center" style="color: white;">Password Reset Complete</h3>

                <div class="container">
                    <div class="alert alert-success" role="alert">
                        Your password has been reset successfully. You can now log in with your new password.
                    </div>
                </div>

                <div class="form-group text-center mt-3">
                    <a href="/login/" class="form-control btn btn-primary submit px-3" style="text-decoration: none;">Go to Login</a>
                </div>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
{% endblock %}
