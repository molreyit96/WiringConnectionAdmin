{% extends 'base_index.html' %}
{% load static %}
{% block content %}

<body class="img js-fullheight" style="background-image: url({% static '/images/wcLogin-bg.jpg'%}); background-repeat: repeat; background-size: cover;">
    <section class="ftco-section">
    <div class="container">
        <div class="row justify-content-center">
                <div class="col-md-6 text-center mb-5">
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4 border pt-4">
                    <div class="login-wrap p-0">
                <h3 class="mb-4 text-center" style="color: white;">Reset Password</h3>

                <p class="text-center" style="color: #ccc;">Enter your email address and we will send you a link to reset your password.</p>

                <form action="/forgot-password/" class="signin-form" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="email" class="form-control" name="email" id="email" placeholder="Email address" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="form-control btn btn-primary submit px-3">Send Reset Link</button>
                    </div>
                    <div class="form-group text-center">
                        <a href="/login/" style="color: #fff">Back to Login</a>
                    </div>
                </form>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
{% endblock %}
